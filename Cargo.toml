[workspace]
resolver = "2"
members = ["crates/mp-core", "crates/mp-app"]

[workspace.package]
version = "1.0.0"
license = "MIT"
edition = "2021"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# 开发时：依赖包按优化档编（界面才跑得动），自己的两个包保持快速增量编译。
[profile.dev.package."*"]
opt-level = 2
